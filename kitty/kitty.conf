# font_family JetBrainsMono Nerd Font, Noto Sans CJK SC
font_size 14.0

cursor_trail 1

window_padding_width 10
# background_blur      30

copy_on_select yes
strip_trailing_spaces smart
cursor_shape block
cursor_shape_unfocused block

# BEGIN_KITTY_THEME
# Tokyo Night
include current-theme.conf
# END_KITTY_THEME


# BEGIN_KITTY_FONTS
font_family      family="JetBrainsMono Nerd Font Mono"
bold_font        auto
italic_font      auto
bold_italic_font auto
# END_KITTY_FONTS